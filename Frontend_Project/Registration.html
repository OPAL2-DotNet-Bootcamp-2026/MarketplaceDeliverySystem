<!DOCTYPE html>
<html lang="en">

<body>
    <main class="auth-layout">

        <aside class="auth-panel-left">
            <div class="auth-logo">
      <span class="auth-logo-mark">M</span>
      <span class="auth-logo-text">Marketplace</span>
    </div>

    <div class="auth-hero-placeholder">
      <img src="" alt="Picture" width="400" height="300">
    </div>

    <p class="auth-headline">Shop local. Delivered to your door.</p>

    <ul class="auth-bullet-list">
      <li>Browse homemade products</li>
      <li>Track your delivery live</li>
    </ul>
        </aside>
        
        <section class="auth-panel-right">
            <h1 class="auth-form-title">SignUp</h1>
                <form class="auth-form" action="#" method="post">

                    <div class="auth-field-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Enter your full name" required>
                    </div>

                    <div class="auth-field-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                    </div>

                    <div class="auth-field-group">
                        <label for="phoneNumber">PhoneNumber</label>
                        <input type="number" id="phoneNumber" name="phoneNumber" class="form-input" placeholder="Enter your PhoneNumber" required>
                    </div>

                    <div class="auth-field-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                    </div>

                    <div class="auth-field-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" class="form-input" placeholder="Enter your address" required>
                    </div>

                    <div class="auth-checkbox">
                        <input type="checkbox" id="terms" name="terms" class="checkbox" required>
                        <label for="terms">I agree to the terms and conditions</label>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit">Create Account</button>

                </form>

        </section>
    </main>
</body>
</html>
