<!DOCTYPE html>
<html lang="en">


<body>

    <main class="auth-layout">

        <aside class="auth-panel-left">
            <div class="auth-logo">
                <img src="asses/IMG/logo (1).png" alt="Marketplace Delivery System logo" class="auth-logo-mark">
                <span class="auth-logo-text">Marketplace</span>
            </div>

            

            <p class="auth-headline">Shop local. <span class="auth-highlight">Delivered</span> to your door.</p>

            <ul class="auth-bullet-list">
                <li><i class="bi bi-check-circle-fill"></i> Browse homemade products</li>
                <li><i class="bi bi-check-circle-fill"></i> Track your delivery </li>
            </ul>
        </aside>

        <section class="auth-panel-right">
            <h1 class="auth-form-title">Login</h1>

            <form class="auth-form" action="#" method="post">

                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                    <label for="email">Email</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required minlength="6">
                    <label for="password">Password</label>
                </div>

                <div class="auth-options-row">
                    <div class="auth-checkbox">
                        <input type="checkbox" id="remember" name="remember" class="checkbox">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="auth-forgot-link">Forgot password?</a>
                </div>

                <div class="login-dual-actions">
                    <button type="submit" class="btn btn-primary auth-submit" name="role" value="customer">Login as
                        Customer</button>
                    <button type="submit" class="btn btn-outline-primary auth-submit" name="role" value="driver">Login
                        as Driver</button>
                </div>

            </form>

            <p class="auth-footer-link">Don't have an account? <a href="Registration.html">Sign up</a></p>
        </section>
    </main>
</body>

</html>
