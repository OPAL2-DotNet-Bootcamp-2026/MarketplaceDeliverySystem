<!DOCTYPE html>
<html lang="en">

<body>
    <main class="auth-layout">

        <aside class="auth-panel-left">
            <div class="auth-logo">
                <span class="auth-logo-mark">M</span>
                <span class="auth-logo-text">Marketplace</span>
            </div>

            <div class="auth-hero-placeholder">
                <span>Hero image</span>
            </div>

            <p class="auth-headline">Shop local. Delivered to your door.</p>

            <ul class="auth-bullet-list">
                <li>Browse homemade products</li>
                <li>Track your delivery live</li>
            </ul>
        </aside>

        <section class="auth-panel-right">
            <h1 class="auth-form-title">Login</h1>

            <form class="auth-form" action="#" method="post">

                <div class="auth-field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="auth-field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required minlength="6">
                </div>

                <div class="auth-options-row">
                    <div class="auth-checkbox">
                        <input type="checkbox" id="remember" name="remember" class="checkbox">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="auth-forgot-link">Forgot password?</a>
                </div>

                <div class="login-dual-actions">
                    <button type="submit" class="btn btn-primary auth-submit" name="role" value="customer">Login as Customer</button>
                    <button type="submit" class="btn btn-outline-primary auth-submit" name="role" value="driver">Login as Driver</button>
                </div>

            </form>

            <p class="auth-footer-link">Don't have an account? <a href="Registration.html">Sign up</a></p>
        </section>
    </main>
</body>
</html>
