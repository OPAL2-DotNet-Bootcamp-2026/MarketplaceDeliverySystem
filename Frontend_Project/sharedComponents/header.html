<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="header.css">
</head>

<body>
    <header class="header">

        <!-- Top section: first section -->
        <!-- This is the top part containing your logo and animated tagline -->
        <div class="header-top">

            <div class="logo-area">

                <!-- Logo -->
                <img src="../assets/img/logo.png" alt="Marketplace Logo" class="marketplace-logo">

                <!-- Logo Text -->
                <div class="logo-text">

                    <div class="logo">
                        MARKETPLACE
                    </div>

                    <div class="logo-subtitle">
                        YOUR WORLD OF SHOPPING
                    </div>

                </div>

            </div>

            <!-- Animated tagline -->
            <div class="tagline-container">
                <span class="tagline-line"></span>
                <div class="tagline">

                    <span class="tagline-item">
                        <span class="tagline-icon">⌕</span>
                        Discover
                    </span>

                    <span class="tagline-item">
                        <span class="tagline-icon">🛍</span>
                        Shop
                    </span>

                    <span class="tagline-item">
                        <span class="tagline-icon">✦</span>
                        Enjoy
                    </span>

                </div>
            </div>



        </div>


        <!-- The bottom Navigation -->
        <!-- It contains:
        ☰     Home   Businesses   Track Order   Orders   Your Driver      👤 🔔 
        But it is also initially hidden-->
        <div class="header-bottom">
            <!-- When the user clicks it, your JavaScript opens the sidebar -->
            <div class="categories">
                <span class="menu-icon">☰</span>

            </div>

            <nav class="navigation">
                <a href="../html pages/home.html">Home</a>
                <a href="../html pages/Businesses.html">Businesses</a>
                <a href="../html pages/TrackOrder.html">Track Order</a>
                <a href="../html pages/OrderHistory.html">Orders</a>
                <a href="../html pages/DriverInfo.html">Your Driver</a>

            </nav>

            <div class="header-icons">
                <!-- Profile -->
                <span class="header-icon" title="Profile">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
                    </svg>
                </span>

                <!-- Notification -->
                <span class="header-icon" title="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                        <path d="M10 21h4"></path>
                    </svg>
                </span>
            </div>

        </div>

    </header>
</body>

</html>
