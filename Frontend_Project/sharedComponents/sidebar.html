<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="sidebar.css">
</head>

<body>
    <aside class="sidebar" id="category-sidebar">

        <!-- Logo -->
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">M</div>

            <div>
                <div class="sidebar-logo-name">
                    MARKET<span>PLACE</span>
                </div>

                <div class="sidebar-logo-subtitle">
                    YOUR WORLD OF SHOPPING
                </div>
            </div>
        </div>


        <!-- User Card -->
        <div class="user-card">

            <div class="user-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
                </svg>
            </div>

            <div class="user-info">
                <h3>Hi, Shopper!</h3>
                <span>MARKETPLACE MEMBER</span>
            </div>

        </div>


        <!-- Menu -->
        <nav class="sidebar-menu">

            <a href="homePage.html" class="sidebar-item active">

                <span class="sidebar-icon">⌂</span>

                <span>Home</span>

            </a>


            <a href="Products.html" class="sidebar-item">

                <span class="sidebar-icon">🛍</span>

                <span>Browse Products</span>

            </a>


            <a href="OrderHistory.html" class="sidebar-item">

                <span class="sidebar-icon">▣</span>

                <span>My Orders</span>

            </a>


            <a href="TrackOrder.html" class="sidebar-item">

                <span class="sidebar-icon">
                    <svg viewBox="0 0 24 24" class="track-icon">
                        <path d="M3 6h11v11H3z"></path>
                        <path d="M14 10h4l3 3v4h-7z"></path>
                        <circle cx="7" cy="19" r="2"></circle>
                        <circle cx="18" cy="19" r="2"></circle>
                    </svg>
                </span>

                <span>Track Delivery</span>

                <span class="live-badge">LIVE</span>

            </a>


            <a href="#" class="sidebar-item">

                <span class="sidebar-icon">♡</span>

                <span>Favorites</span>

            </a>


            <a href="#" class="sidebar-item">

                <span class="sidebar-icon">
                    <svg viewBox="0 0 24 24" class="profile-icon">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
                    </svg>
                </span>

                <span>Profile</span>

            </a>


            <a href="#" class="sidebar-item">

                <span class="sidebar-icon">⚙</span>

                <span>Settings</span>

            </a>

        </nav>


        <!-- Promotional Card -->
        <div class="sidebar-promo">

            <div class="promo-content">

                <h2>Ready to Shop?</h2>

                <p>
                    Discover amazing products
                    from different sellers.
                </p>

                <a href="Products.html">
                    Shop Now
                </a>

            </div>

        </div>


        <!-- Logout -->
        <div class="logout-section">

            <a href="#" class="logout-button">

                <span class="logout-icon">→</span>

                <span>Log Out</span>

            </a>

        </div>


        <!-- Close -->
        <button class="close-sidebar" id="close-sidebar">
            &times;
        </button>

    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
</body>

</html>
