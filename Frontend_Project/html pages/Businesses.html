<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Businesses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="../sharedComponents/header.css">
    <link rel="stylesheet" href="../sharedComponents/sidebar.css">
    <link rel="stylesheet" href="../styling/HorizantalCardStyle.css">
    <link rel="stylesheet" href="../styling/PageNavigationStyle.css">
    <link rel="stylesheet" href="../styling/AsideStyle.css">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
</head>

<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>

    <main class="py-4">
        <div class="container">
            <div class="row">

                <!-- LEFT SIDEBAR: Categories Aside -->
                <div class="col-12 col-md-4 col-lg-3 mb-4">
                    <aside class="categories-aside p-3 shadow-sm rounded-3 bg-white border">
                        <div class="d-flex align-items-center justify-content-between mb-3 px-1">
                            <h5 class="categories-header-title mb-0 fw-bold" style="color: var(--brand-navy);">
                                Categories
                            </h5>
                            <small class="text-muted">Home Businesses</small>
                        </div>

                        <!-- Categories rendered dynamically via JS (No Badges/Counts) -->
                        <div class="list-group list-group-flush border-0" id="category-filter-list">
                            <div class="text-center py-3 text-muted">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Loading categories...
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- RIGHT CONTENT AREA -->
                <div class="col-12 col-md-8 col-lg-9">

                    <!-- HEADER -->
                    <div class="d-flex align-items-center justify-content-between mb-3 px-1">
                        <div>
                            <h4 class="fw-bold mb-0" style="color: var(--brand-navy);">Home Businesses</h4>
                            <small class="text-muted">Explore local registered vendors and kitchens</small>
                        </div>
                    </div>

                    <!-- FULL WIDTH BUSINESS CARDS GRID -->
                    <div id="businesses-list" class="d-flex flex-column gap-3 mb-4">
                        <div class="text-center py-4 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Loading businesses...
                        </div>
                    </div>

                    <!-- PAGINATION -->
                    <nav aria-label="Page navigation" class="mt-4">
                        <ul id="pagination-list" class="pagination justify-content-center"></ul>
                    </nav>

                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../sharedComponents/component.js"></script>
    <script src="../sharedComponents/header.js"></script>
    <script src="../JavaScript/Businesses.js"></script>
</body>

</html>
