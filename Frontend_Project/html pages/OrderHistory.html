<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | Marketplace</title>


    <!-- =========================================
         SHARED COMPONENTS CSS
         ========================================= -->

    <link rel="stylesheet"
          href="../sharedComponents/header.css">

    <link rel="stylesheet"
          href="../sharedComponents/sidebar.css">

    <link rel="stylesheet"
          href="../sharedComponents/footer.css">

    <link rel="stylesheet"
          href="../sharedComponents/layout.css">


    <!-- =========================================
         ORDER HISTORY CSS
         ========================================= -->

    <link rel="stylesheet"
          href="../css pages/orderhistory.css">

</head>


<body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <div id="header-container"></div>



    <!-- =========================================
         SIDEBAR
         ========================================= -->

    <div id="sidebar-container"></div>



    <!-- =========================================
         MAIN ORDER HISTORY
         ========================================= -->

    <main class="order-page">


        <!-- =====================================
             HERO SECTION
             ===================================== -->

        <section class="orders-hero">


            <div class="hero-content">

                <span class="hero-label">
                    MY ACCOUNT
                </span>


                <h1>
                    My Orders
                </h1>


                <p>
                    View, track and manage your orders.
                </p>

            </div>



            <!-- Total Orders -->

            <div class="hero-order-number">

                <strong id="total-orders">
                    0
                </strong>

                <span>
                    Total Orders
                </span>

            </div>


        </section>



        <!-- =====================================
             ORDER STATISTICS
             ===================================== -->

        <section class="order-statistics">


            <!-- Total Orders -->

            <article class="stat-card">

                <div class="stat-icon">
                    🛍️
                </div>


                <div class="stat-content">

                    <span>
                        Total Orders
                    </span>

                    <strong id="stat-total">
                        0
                    </strong>

                </div>

            </article>



            <!-- Pending -->

            <article class="stat-card">

                <div class="stat-icon">
                    ⏳
                </div>


                <div class="stat-content">

                    <span>
                        Pending
                    </span>

                    <strong id="stat-pending">
                        0
                    </strong>

                </div>

            </article>



            <!-- Completed -->

            <article class="stat-card">

                <div class="stat-icon">
                    ✓
                </div>


                <div class="stat-content">

                    <span>
                        Completed
                    </span>

                    <strong id="stat-completed">
                        0
                    </strong>

                </div>

            </article>



            <!-- Cancelled -->

            <article class="stat-card">

                <div class="stat-icon">
                    ×
                </div>


                <div class="stat-content">

                    <span>
                        Cancelled
                    </span>

                    <strong id="stat-cancelled">
                        0
                    </strong>

                </div>

            </article>


        </section>



        <!-- =====================================
             SEARCH / FILTER / SORT
             ===================================== -->

        <section class="orders-toolbar">


            <!-- Search -->

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>


                <input
                    type="text"
                    id="search-orders"
                    placeholder="Search by order ID or product..."
                    autocomplete="off"
                >

            </div>



            <!-- Status Filter -->

            <select id="status-filter">

                <option value="all">
                    All Status
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="shipped">
                    Shipped
                </option>

                <option value="delivered">
                    Delivered
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>



            <!-- Sort -->

            <select id="sort-orders">

                <option value="newest">
                    Newest First
                </option>

                <option value="oldest">
                    Oldest First
                </option>

                <option value="highest">
                    Highest Amount
                </option>

                <option value="lowest">
                    Lowest Amount
                </option>

            </select>


        </section>



        <!-- =====================================
             RESULTS INFORMATION
             ===================================== -->

        <div class="results-info">

            <span id="results-text">
                Showing orders
            </span>

        </div>



        <!-- =====================================
             ORDERS CONTAINER
             ===================================== -->

        <section
            id="orders-container"
            class="orders-container">

        </section>



        <!-- =====================================
             PAGINATION
             ===================================== -->

        <div
            id="pagination"
            class="pagination">

        </div>


    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <div id="footer-container"></div>



    <!-- =========================================
         SHARED JAVASCRIPT
         ========================================= -->

    <script src="../sharedComponents/header.js"></script>

    <script src="../sharedComponents/component.js"></script>



    <!-- =========================================
         ORDER HISTORY JAVASCRIPT
         ========================================= -->

    <script src="../JavaScript/OrderHistory.js?v=6"></script>


</body>

</html>
