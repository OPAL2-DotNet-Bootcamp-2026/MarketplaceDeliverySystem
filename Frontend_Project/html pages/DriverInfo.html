<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
    <link rel="stylesheet" href="../sharedComponents/header.css">
    <link rel="stylesheet" href="../sharedComponents/sidebar.css">
    <title>Driver Info</title>
    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="../css pages/driverInfo.css">
</head>

<body>
    <div id="header-container"></div>

    <div id="sidebar-container"></div>
    <main class="container">
        <!-- Top Title Row -->
        <header class="page-header">
            <div class="heading-row">
                <a href="Products.html" class="back-link">← Back to Shopping</a>
                <h1>YOUR DRIVER</h1>
            </div>
        </header>

        <!-- 1. Delivery Status Card -->
        <section class="card delivery-status">
            <div class="card-header">
                <img src="../assets/img/TruckIconCircle.png" alt="Delivery Icon" class="card-icon">
                <h2>DELIVERY STATUS</h2>
            </div>

            <div class="info-box">
                <span class="label"><span class="dot">•</span> Your Driver</span>
                <span class="value" id="driver-name">Loading...</span>
            </div>

            <div class="info-box">
                <span class="label"><span class="dot">•</span> Phone Number</span>
                <span class="value" id="driver-phone">Loading...</span>
            </div>
        </section>
    </main>
    <script src="../sharedComponents/header.js"></script>
    <div id="footer-container"></div>

    <script src="../sharedComponents/component.js"></script>
    <script src="../JavaScript/DriverInfo.js"></script>
</body>

</html>
