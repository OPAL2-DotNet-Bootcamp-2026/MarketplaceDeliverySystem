<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Track Order</title>

    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="../sharedComponents/header.css">
    <link rel="stylesheet" href="../sharedComponents/sidebar.css">
    <link rel="stylesheet" href="../css pages/TrackOrder.css">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
</head>

<body>
    <div id="header-container"></div>

    <div id="sidebar-container"></div>
    <main class="track-page">

        <!-- Page Header -->
        <section class="track-header">

            <span class="track-label">ORDER TRACKING</span>

            <h1>Track Your Orders</h1>

            <p>
               View your current orders and recent deliveries below.
            </p>

        </section>


        <!-- Active Orders -->
        <section id="orders-container" class="orders-container">

            <!-- JavaScript will add the active order cards here -->

        </section>

    </main>
    <!-- Driver Information Modal -->
    <div id="driver-modal" class="driver-modal">

        <div class="driver-modal-content">

            <button type="button" id="close-driver-modal" class="close-driver-modal">
                &times;
            </button>

            <h2>Driver Information</h2>

            <div class="driver-info-item">
                <span>Driver Name</span>

                <strong id="modal-driver-name">
                    Loading...
                </strong>
            </div>

            <div class="driver-info-item">
                <span>Phone Number</span>

                <strong id="modal-driver-phone">
                    Loading...
                </strong>
            </div>

        </div>

    </div>

    <script src="../sharedComponents/header.js"></script>
    <div id="footer-container"></div>
    <!-- Load and run the JavaScript code from component.js -->
    <!-- <script> is an HTML element used to include or write JavaScript in an HTML page. -->
    <script src="../sharedComponents/component.js"></script>
    <script src="../Typescript/dist/TrackOrder.js"></script>
    <!-- <script src="TrackOrder.js"></script> -->

</body>

</html>
