<!DOCTYPE html>
<html lang="en">

<!--
  Page: Customer Registration
  Links to: Login.html (via "Already have an account?")
  Linked from: role-selection.html
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Marketplace Delivery System</title>
    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styling/variables.css">
    <link rel="stylesheet" href="../styling/auth.css">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
</head>

<body>
    <main class="auth-layout">

        <aside class="auth-panel-left">
            <div class="auth-logo">
                <img src="../assets/img/logo.png" alt="Marketplace Delivery System logo" class="auth-logo-mark">
                <span class="auth-logo-text">Marketplace</span>
            </div>

            <div class="auth-hero-placeholder">
                <img src="../assets/img/ezgif.com-optimize.gif" alt="" class="auth-hero-img">
            </div>

            <p class="auth-headline">Shop local. <span class="auth-highlight">Delivered</span> to your door.</p>

            <ul class="auth-bullet-list">
                <li><i class="bi bi-check-circle-fill"></i> Browse homemade products</li>
                <li><i class="bi bi-check-circle-fill"></i> Track your delivery</li>
            </ul>
        </aside>

        <section class="auth-panel-right">
            <h1 class="auth-form-title">SignUp</h1>

            <form class="auth-form" id="registerForm" action="#" method="post">

                <div class="form-floating">
                    <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Full Name"
                        required>
                    <label for="fullName">Full Name</label>
                </div>

                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                    <label for="email">Email</label>
                </div>

                <div class="form-floating">
                    <input type="tel" class="form-control" id="phone" name="phoneNumber" placeholder="Phone Number"
                        required minlength="8">
                    <label for="phone">Phone Number</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required minlength="6">
                    <label for="password">Password</label>
                </div>

                <div class="form-floating">
                    <input type="text" class="form-control" id="address" name="address" placeholder="Address" required>
                    <label for="address">Address</label>
                </div>

                <!-- SHARED — checkbox appearance -->
                <div class="auth-checkbox">
                    <input type="checkbox" id="terms" name="terms" class="checkbox" required>
                    <label for="terms">I agree to the terms and conditions</label>
                </div>

                <!-- SHARED — button appearance -->
                <button type="submit" class="btn btn-primary auth-submit">Create Account</button>

            </form>

            <p class="auth-footer-link">Already have an account? <a href="Login.html">Log in</a></p>
        </section>
    </main>
    <div id="footer-container"></div>
    <!-- Load and run the JavaScript code from component.js -->
    <!-- <script> is an HTML element used to include or write JavaScript in an HTML page. -->
    <script src="../sharedComponents/component.js"></script>
</body>

</html>
