<!DOCTYPE html>
<html lang="en">

<!--
  Page: Login (shared across roles)
  Links to: Registration.html (via "Don't have an account?")
  Linked from: role-selection.html
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marketplace Delivery System</title>
    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styling/variables.css">
    <link rel="stylesheet" href="../styling/auth.css">
</head>

<body>

    <main class="auth-layout">

        <aside class="auth-panel-left">
            <div class="auth-logo">
                <img src="../assets/img/logo.png" alt="Marketplace Delivery System logo" class="auth-logo-mark">
                <span class="auth-logo-text">Marketplace</span>
            </div>

            <div class="auth-hero-placeholder">
                <img src="../assets/img/ezgif.com-optimize.gif" alt="" class="auth-hero-img">
            </div>

            <p class="auth-headline">Shop local. <span class="auth-highlight">Delivered</span> to your door.</p>

            <ul class="auth-bullet-list">
                <li><i class="bi bi-check-circle-fill"></i> Browse homemade products</li>
                <li><i class="bi bi-check-circle-fill"></i> Track your delivery</li>
            </ul>
        </aside>

        <section class="auth-panel-right">
            <h1 class="auth-form-title">Login</h1>

            <form class="auth-form" id="loginForm" action="#" method="post">

                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                    <label for="email">Email</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required minlength="6">
                    <label for="password">Password</label>
                </div>

                <div class="auth-options-row">
                    <!-- SHARED — checkbox appearance -->
                    <div class="auth-checkbox">
                        <input type="checkbox" id="remember" name="remember" class="checkbox">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="auth-forgot-link">Forgot password?</a>
                </div>

                <div id="loginError" class="alert alert-danger" style="display: none;"></div>

                <button type="submit" class="btn btn-primary auth-submit">Login</button>

            </form>

            <p class="auth-footer-link">Don't have an account? <a href="Registration.html">Sign up</a></p>
        </section>
    </main>
    <script src="../sharedComponents/header.js"></script>
    <div id="footer-container"></div>
    <!-- Load and run the JavaScript code from component.js -->
    <!-- <script> is an HTML element used to include or write JavaScript in an HTML page. -->
    <script src="../sharedComponents/component.js"></script>
    <script src="../JavaScript/Login.js" defer></script>
</body>

</html>
