<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../sharedComponents/header.css">
    <link rel="stylesheet" href="../sharedComponents/sidebar.css">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="../css pages/PaymentResult.css">
    <title>Payment Result</title>
</head>

<body>
    <div id="header-container"></div>

    <div id="sidebar-container"></div>
    <main class="container">
        <section class="result-card" id="resultCard" data-state="loading">
            <h1 id="resultTitle">Confirming your payment...</h1>
            <p id="resultMessage">Please wait while we check with the payment provider.</p>
            <p class="test-badge" id="testBadge" hidden>Test payment, no real money was charged.</p>

            <div class="result-actions">
                <a href="TrackOrder.html" class="btn-primary" id="trackBtn" hidden>Track Your Order</a>
                <a href="PlaceOrder.html" class="btn-secondary" id="retryBtn" hidden>Back to Checkout</a>
            </div>
        </section>
    </main>

    <script src="../sharedComponents/header.js"></script>
    <div id="footer-container"></div>

    <script src="../sharedComponents/component.js"></script>
    <script src="../Typescript/dist/PaymentResult.js"></script>
</body>

</html>
