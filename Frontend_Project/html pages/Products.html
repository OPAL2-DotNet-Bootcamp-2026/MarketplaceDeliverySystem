<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../sharedComponents/footer.css">
    <link rel="stylesheet" href="../sharedComponents/header.css">
    <link rel="stylesheet" href="../sharedComponents/sidebar.css">
    <link rel="stylesheet" href="../sharedComponents/layout.css">
    <link rel="stylesheet" href="../styling/BusinessCardStyle.css">
    <link rel="stylesheet" href="/styling/ProductCardStyle.css">
    <link rel="stylesheet" href="/styling/PageNavigationStyle.css">
</head>

<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>

    <main class="py-4">
        <div class="container max-content-width">

            <!-- 1. TOP BACK LINK -->
            <div class="mb-3">
                <a href="/html pages/Businesses.html" class="top-back-link">
                    ← Go back to Businesses
                </a>
            </div>

            <!-- 2. BUSINESS INFORMATION HEADER CARD -->
            <div id="business-info-container" class="card business-header-card mb-4 shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center justify-content-center py-3 text-muted">
                        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                        Loading business information...
                    </div>
                </div>
            </div>

            <!-- 3. PRODUCTS SECTION HEADER & SUBCATEGORY PILLS -->
            <div class="mb-3">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div>
                        <h4 class="fw-bold mb-0 text-brand-navy">Products</h4>
                        <small class="text-muted">Parent Category: <span id="parent-category-title"
                                class="fw-semibold text-brand-teal">Food & Kitchen</span></small>
                    </div>
                    <span id="available-items-badge" class="badge rounded-pill px-3 py-2 badge-brand-count">
                        0 Available Items
                    </span>
                </div>

                <!-- Subcategory Filter Pills -->
                <div id="product-pills-container" class="subcategory-pills mt-3">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- 4. PRODUCT LIST (HORIZONTAL CARDS) -->
            <div id="products-list-container" class="d-flex flex-column gap-3">
                <div class="text-center py-4 text-muted">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    Loading products...
                </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <a href="/html pages/PlaceOrder.html" class="btn-proceed-order">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span>Proceed to Place Order</span>
                    <span>→</span>
                </a>
            </div>

            <!-- 6. PAGE NAVIGATION -->
            <nav aria-label="Page navigation" class="mt-4">
                <ul id="pagination-list" class="pagination justify-content-center"></ul>
            </nav>

        </div>
    </main>

    <!-- ===================================================
         DYNAMIC PRODUCT MODALS CONTAINER
    =================================================== -->
    <div id="product-modals-container"></div>

    <div id="footer-container"></div>

    <!-- Bootstrap Bundle JS (Required for modal popups) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../sharedComponents/component.js"></script>
    <script src="../sharedComponents/header.js"></script>
    <script src="../JavaScript/Products.js"></script>
</body>

</html>
