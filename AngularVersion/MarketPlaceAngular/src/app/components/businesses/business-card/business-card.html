<article class="card business-horizontal-card shadow-sm">
  <div class="card-body p-3">
    <div class="d-flex align-items-center gap-3">
      <img [src]="logoUrl()" class="business-card-img flex-shrink-0" [alt]="business().businessName + ' Logo'" (error)="usePlaceholder($event)">
      <div class="d-flex flex-column justify-content-center">
        <h5 class="card-title mb-1">
          <a [routerLink]="['/businesses', business().businessId, 'products']" class="text-decoration-none stretched-link">{{ business().businessName }}</a>
        </h5>
        <div class="d-flex align-items-center mt-1">
          <span class="badge small" [class.badge-status-open]="business().isOpen" [class.badge-status-closed]="!business().isOpen">🕒 {{ formatHours() }}</span>
        </div>
      </div>
    </div>
  </div>
</article>
